[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wanjie*"]

[tool.setuptools.package-data]
wanjie = ["word_banks/**/*.json", "word_banks/**/*.md"]

[project]
name = "wanjie"
version = "3.0.0"
description = "双引擎程序化小说生成系统——《万界归墟》（内核依赖 novel-generator）"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "wanjie contributors"}
]
keywords = ["novel", "procedural-generation", "chinese-novel", "creative-writing"]
dependencies = [
    # ★ 通用内核：WordBank / TemplateEngine 的基类由它提供（PyPI: novel-generator）
    "novel-generator>=2.0.0",
    "flask>=3.0",
    "waitress>=3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
# 注意：不能叫 novel-gen —— 该入口名已归内核 novel-generator 所有
wanjie = "wanjie.__main__:main"

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
# 项目级忽略：E402=sys.path 前置导入（项目惯例）
# E501=行太长（大量 docstring 与长字符串）
# E701/E702=同行多语句（低优先级风格）
# E741=模糊变量名（如 'l'）
ignore = ["E402", "E501", "E701", "E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["wanjie/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["wanjie"]
omit = ["wanjie/tests/*"]

[tool.coverage.report]
fail_under = 30

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
# suppress no_implicit_optional (project-wide, 30+ sites; requires Optional[X] refactor)
implicit_optional = true
# files to check
files = ["wanjie"]
# strictness (incremental path to removing CI || true)
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
